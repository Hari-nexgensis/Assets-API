{% extends 'main.html' %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-6">
        <h1><i class="bi bi-box-seam"></i> Asset Management</h1>
    </div>
    <div class="col-md-6 text-end">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addAssetModal">
            <i class="bi bi-plus-circle"></i> Add Asset
        </button>
        <button class="btn btn-outline-secondary" onclick="clearFilters()">
            <i class="bi bi-x-circle"></i> Clear Filters
        </button>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="table-light">
                    <tr>
                        <th>
                            <div class="d-flex justify-content-between align-items-center">
                                <span>Asset Name</span>
                                <button class="btn btn-sm btn-link p-0" onclick="sortTable('asset_name')">
                                    <i class="bi bi-arrow-down-up"></i>
                                </button>
                            </div>
                            <input type="text" class="form-control form-control-sm mt-1" id="filter_asset_name" placeholder="Filter...">
                        </th>
                        <th>
                            <div class="d-flex justify-content-between align-items-center">
                                <span>Code</span>
                                <button class="btn btn-sm btn-link p-0" onclick="sortTable('asset_code')">
                                    <i class="bi bi-arrow-down-up"></i>
                                </button>
                            </div>
                            <input type="text" class="form-control form-control-sm mt-1" id="filter_asset_code" placeholder="Filter...">
                        </th>
                        <th>
                            <div class="d-flex justify-content-between align-items-center">
                                <span>Type</span>
                                <button class="btn btn-sm btn-link p-0" onclick="sortTable('asset_type')">
                                    <i class="bi bi-arrow-down-up"></i>
                                </button>
                            </div>
                            <input type="text" class="form-control form-control-sm mt-1" id="filter_asset_type" placeholder="Filter...">
                        </th>
                        <th>
                            <div class="d-flex justify-content-between align-items-center">
                                <span>Location</span>
                                <button class="btn btn-sm btn-link p-0" onclick="sortTable('location')">
                                    <i class="bi bi-arrow-down-up"></i>
                                </button>
                            </div>
                            <input type="text" class="form-control form-control-sm mt-1" id="filter_location" placeholder="Filter...">
                        </th>
                        <th>
                            <div class="d-flex justify-content-between align-items-center">
                                <span>Manager</span>
                                <button class="btn btn-sm btn-link p-0" onclick="sortTable('manager')">
                                    <i class="bi bi-arrow-down-up"></i>
                                </button>
                            </div>
                            <input type="text" class="form-control form-control-sm mt-1" id="filter_manager" placeholder="Filter...">
                        </th>
                        <th>
                            <div class="d-flex justify-content-between align-items-center">
                                <span>Status</span>
                                <button class="btn btn-sm btn-link p-0" onclick="sortTable('is_active')">
                                    <i class="bi bi-arrow-down-up"></i>
                                </button>
                            </div>
                            <select class="form-select form-select-sm mt-1" id="filter_is_active">
                                <option value="">All</option>
                                <option value="true">Active</option>
                                <option value="false">Inactive</option>
                            </select>
                        </th>
                        <th>
                            <div class="d-flex justify-content-between align-items-center">
                                <span>Start Date</span>
                                <button class="btn btn-sm btn-link p-0" onclick="sortTable('start_date')">
                                    <i class="bi bi-arrow-down-up"></i>
                                </button>
                            </div>
                        </th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="assetTableBody">
                    <tr>
                        <td colspan="8" class="text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="row mt-3">
            <div class="col-md-6">
                <p class="text-muted" id="resultInfo">Loading...</p>
            </div>
            <div class="col-md-6">
                <nav aria-label="Asset pagination">
                    <ul class="pagination justify-content-end mb-0" id="pagination"></ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<!-- Add Asset Modal -->
<div class="modal fade" id="addAssetModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Asset</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addAssetForm">
                    <div class="mb-3">
                        <label class="form-label">Asset Name</label>
                        <input type="text" class="form-control" name="asset_name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Asset Code</label>
                        <input type="text" class="form-control" name="asset_code" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Type</label>
                        <input type="text" class="form-control" name="asset_type" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Location</label>
                        <input type="text" class="form-control" name="location" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Manager</label>
                        <input type="text" class="form-control" name="manager" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Start Date</label>
                        <input type="date" class="form-control" name="start_date" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="addAsset()">Save Asset</button>
            </div>
        </div>
    </div>
</div>

<style>
    th input, th select {
        font-weight: normal;
    }
    .btn-link {
        text-decoration: none;
        color: #6c757d;
    }
    .btn-link:hover {
        color: #0d6efd;
    }
</style>

<script>
let currentPage = 1;
let currentSort = 'id';
let currentOrder = 'asc';
let searchTimeouts = {};

// Load assets on page load
document.addEventListener('DOMContentLoaded', function() {
    loadAssets();
    
    // Add event listeners to all filter inputs
    ['asset_name', 'asset_code', 'asset_type', 'location', 'manager', 'is_active'].forEach(field => {
        const element = document.getElementById(`filter_${field}`);
        element.addEventListener('input', function() {
            clearTimeout(searchTimeouts[field]);
            searchTimeouts[field] = setTimeout(() => {
                currentPage = 1;
                loadAssets();
            }, 500);
        });
    });
});

// Build URL with filters
function buildURL() {
    let url = `/assets/?page=${currentPage}&sort_by=${currentSort}&order=${currentOrder}`;
    
    const filters = {
        asset_name: document.getElementById('filter_asset_name').value,
        asset_code: document.getElementById('filter_asset_code').value,
        asset_type: document.getElementById('filter_asset_type').value,
        location: document.getElementById('filter_location').value,
        manager: document.getElementById('filter_manager').value,
        is_active: document.getElementById('filter_is_active').value
    };
    
    Object.keys(filters).forEach(key => {
        if (filters[key]) {
            url += `&${key}=${encodeURIComponent(filters[key])}`;
        }
    });
    
    return url;
}

// Load assets from API
function loadAssets() {
    const url = buildURL();

    fetch(url)
        .then(response => response.json())
        .then(data => {
            displayAssets(data.results);
            displayPagination(data);
            updateResultInfo(data);
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('assetTableBody').innerHTML = 
                '<tr><td colspan="8" class="text-center text-danger">Error loading assets</td></tr>';
        });
}

// Display assets in table
function displayAssets(assets) {
    const tbody = document.getElementById('assetTableBody');
    
    if (assets.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center">No assets found</td></tr>';
        return;
    }

    tbody.innerHTML = assets.map(asset => `
        <tr>
            <td>${asset.asset_name}</td>
            <td><span class="badge bg-secondary">${asset.asset_code}</span></td>
            <td>${asset.asset_type}</td>
            <td>${asset.location}</td>
            <td>${asset.manager}</td>
            <td>
                ${asset.is_active 
                    ? '<span class="badge bg-success">Active</span>' 
                    : '<span class="badge bg-danger">Inactive</span>'}
            </td>
            <td>${asset.start_date}</td>
            <td>
                <button class="btn btn-sm btn-info" onclick="viewAsset(${asset.id})" title="View">
                    <i class="bi bi-eye"></i>
                </button>
                <button class="btn btn-sm btn-danger" onclick="deleteAsset(${asset.id})" title="Delete">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        </tr>
    `).join('');
}

// Update result info
function updateResultInfo(data) {
    const start = (currentPage - 1) * 10 + 1;
    const end = Math.min(currentPage * 10, data.count);
    document.getElementById('resultInfo').textContent = 
        `Showing ${start} to ${end} of ${data.count} assets`;
}

// Display pagination
function displayPagination(data) {
    const pagination = document.getElementById('pagination');
    const totalPages = Math.ceil(data.count / 10);
    
    if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
    }
    
    let html = '';
    
    // Previous button
    html += `<li class="page-item ${!data.previous ? 'disabled' : ''}">
        <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">Previous</a>
    </li>`;
    
    // Page numbers (show max 5 pages)
    let startPage = Math.max(1, currentPage - 2);
    let endPage = Math.min(totalPages, startPage + 4);
    
    if (endPage - startPage < 4) {
        startPage = Math.max(1, endPage - 4);
    }
    
    for (let i = startPage; i <= endPage; i++) {
        html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
            <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
        </li>`;
    }
    
    // Next button
    html += `<li class="page-item ${!data.next ? 'disabled' : ''}">
        <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">Next</a>
    </li>`;
    
    pagination.innerHTML = html;
}

// Change page
function changePage(page) {
    currentPage = page;
    loadAssets();
}

// Sort table
function sortTable(field) {
    if (currentSort === field) {
        currentOrder = currentOrder === 'asc' ? 'desc' : 'asc';
    } else {
        currentSort = field;
        currentOrder = 'asc';
    }
    currentPage = 1;
    loadAssets();
}

// Clear all filters
function clearFilters() {
    document.getElementById('filter_asset_name').value = '';
    document.getElementById('filter_asset_code').value = '';
    document.getElementById('filter_asset_type').value = '';
    document.getElementById('filter_location').value = '';
    document.getElementById('filter_manager').value = '';
    document.getElementById('filter_is_active').value = '';
    currentPage = 1;
    currentSort = 'id';
    currentOrder = 'asc';
    loadAssets();
}

// Add new asset
function addAsset() {
    const form = document.getElementById('addAssetForm');
    const formData = new FormData(form);
    const data = Object.fromEntries(formData);

    fetch('/assets/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(data => {
        bootstrap.Modal.getInstance(document.getElementById('addAssetModal')).hide();
        form.reset();
        loadAssets();
        alert('Asset added successfully!');
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Error adding asset');
    });
}

// View asset details
function viewAsset(id) {
    fetch(`/assets/${id}/`)
        .then(response => response.json())
        .then(data => {
            alert(`Asset Details:\n\nName: ${data.asset_name}\nCode: ${data.asset_code}\nType: ${data.asset_type}\nLocation: ${data.location}\nManager: ${data.manager}\nStatus: ${data.is_active ? 'Active' : 'Inactive'}\nStart Date: ${data.start_date}`);
        });
}

// Delete asset
function deleteAsset(id) {
    if (confirm('Are you sure you want to delete this asset?')) {
        fetch(`/assets/${id}/`, {
            method: 'DELETE'
        })
        .then(() => {
            loadAssets();
            alert('Asset deleted successfully!');
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error deleting asset');
        });
    }
}
</script>

{% endblock content %}
