version: '3.8'

services:
  web:  # Your Django app service
    build: .
    command: sh -c "sleep 5 && python manage.py migrate && python manage.py collectstatic --noinput && gunicorn Asset_main.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DATABASE_URL=postgres://postgres:p@ssw0rd@db:5432/test
      - OTEL_SERVICE_NAME=my-django-app
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
    depends_on:
      - db
      - jaeger

  nginx:  # Nginx reverse proxy
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web

  db:  # Your PostgreSQL service
    image: postgres:16-alpine
    environment:
      # These variables create the database and user for you
      - POSTGRES_DB=test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=p@ssw0rd
    volumes:
      - postgres_data:/var/lib/postgresql/data

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC endpoint

volumes:
  postgres_data:
  static_volume:
  media_volume:

